name: Validate read-only MCP prototype
on: [push, pull_request]
jobs:
  test:
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      - name: Install checkout prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs ca-certificates
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        working-directory: darkwessos-office-mcp
        run: python -m pip install -r requirements.txt
      - name: Test on Python 3.12
        working-directory: darkwessos-office-mcp
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider
