name: DARKWESSOS read-only MCP regression

on:
  push:
    paths:
      - "darkwessos-office-mcp/**"
      - ".github/workflows/mcp-readonly-ci.yml"
  pull_request:
    paths:
      - "darkwessos-office-mcp/**"
      - ".github/workflows/mcp-readonly-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: darkwessos-office-mcp
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install reproducible tested dependencies
        run: python -m pip install -r requirements.txt -c constraints-ci.txt
      - name: Verify original MCP regression tests and stdio subprocess
        run: python -B -m pytest -q -p no:cacheprovider
