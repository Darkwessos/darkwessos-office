name: DARKWESSOS debug APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK for Capacitor 7
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Resolve dependencies and lock
        run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run android:prepare
      - name: Optional existing debug signing key
        env:
          DEBUG_KEY: ${{ secrets.DARKWESSOS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo '::warning::No persistent debug key supplied. A new key may prevent updating a previous APK. Export JSON before changing installations.'
          fi
      - name: Assemble embedded debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: darkwessos-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-dependency-lock
          path: package-lock.json
