name: Office v0.1 one-time bootstrap
on:
  push:
    branches: [feature/office-v0-1-story-shell]
    paths: [.office-bootstrap.txt]
permissions:
  contents: write
jobs:
  install-verify:
    if: github.ref == 'refs/heads/feature/office-v0-1-story-shell'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Extract authored Office candidate
        run: |
          base64 -d .office-bootstrap.txt | tar -xJf -
      - name: Resolve and lock dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install project
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified files on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .office-bootstrap.txt .github/workflows/office-bootstrap.yml
          git add package.json package-lock.json vite.config.js index.html src/
          git diff --cached --check
          git commit -m "feat(office): introduce Living Nord shell and local Story editor"
          git push origin HEAD:feature/office-v0-1-story-shell
