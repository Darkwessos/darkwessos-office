name: DARKWESSOS Office — test and build

on:
  push:
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/office-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/office-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  office:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          cache: "npm"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
